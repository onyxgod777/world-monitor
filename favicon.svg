<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="World Monitor">
  <title>World Monitor</title>
  <rect width="32" height="32" rx="7" fill="#0f1729"/>
  
  <circle cx="16" cy="16" r="10.4" fill="none" stroke="#6ea8fe" stroke-width="3.0"/>
  <ellipse cx="16" cy="16" rx="4.9" ry="10.4" fill="none" stroke="#6ea8fe" stroke-width="2.3" opacity=".95"/>
  <path d="M7.10 16h17.80" stroke="#6ea8fe" stroke-width="2.3"
