# World Monitor — fast snapshots (USGS quakes + GDACS/NWS floods).
#
# These snapshots used to be generated by cron on the maintainer's laptop, so the
# live panels froze whenever that machine was off. They now run here, on GitHub's
# runners, so worldmonitor.thealpha-secret.xyz keeps refreshing with nothing but
# GitHub Pages in the serving path.
#
# Scheduled runs are free (public repo) and are only committed when the data
# actually changed, so idle cycles add no commits. GitHub may delay scheduled
# runs by a few minutes under load.
name: WM snapshots — fast

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'fetch_quakes.py'
      - 'fetch_floods.py'
      - '.github/workflows/snapshots-fast.yml'

permissions:
  contents: write

concurrency:
  group: wm-snapshots-fast
  cancel-in-progress: false

jobs:
  snapshots:
    runs-on: ubuntu-latest
    # The fetchers resolve their output paths from WM_REPO_DIR; here that is the
    # Actions checkout, so the same scripts run unmodified in the cloud.
    env:
      WM_REPO_DIR: ${{ github.workspace }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Each fetcher exits non-zero when a source yields nothing (it refuses to
      # clobber a good snapshot with an empty one). Let the others still run, but
      # record how many failed so the run itself reports a runner-side outage.
      - name: Generate snapshots
        id: fetch
        run: |
          set +e
          fail=0
          python3 fetch_quakes.py || fail=$((fail+1))
          python3 fetch_floods.py || fail=$((fail+1))
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
          echo "--- produced ---"
          grep -o '"_updated": "[^"]*"' quakes.js floods.js 2>/dev/null | head
          if [ "$fail" -ge 2 ]; then
            echo "::error::every fetcher failed — the runner could not reach any source"
            exit 1
          fi
          if [ "$fail" -gt 0 ]; then
            echo "::warning::$fail fetcher(s) hit an unreachable/empty source this cycle"
          fi
          exit 0

      - name: Commit and push when changed
        run: |
          set -e
          git config user.name  "world-monitor-bot"
          git config user.email "world-monitor-bot@users.noreply.github.com"
          git add quakes.js floods.js
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "snapshot: quakes + floods (automated, $(date -u '+%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "push failed after 4 attempts"; exit 1
