# World Monitor — four-hourly snapshots (NCMEC alerts, WHO outbreak bulletins,
# ISS element set, FIGU world-population scans).
#
# Slow-moving sources, so a 4-hour cadence keeps load (and Nominatim geocoding
# calls) polite. Runs on GitHub's runners, independent of the maintainer's laptop.
# The ISS TLE is refreshed here so the browser can propagate the station locally
# (satellite.js) instead of polling a tracking API.
name: WM snapshots — 4h

on:
  schedule:
    - cron: '12 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'fetch_amber.py'
      - 'fetch_outbreaks.py'
      - 'fetch_iss.py'
      - 'fetch_worldpop.py'
      - '.github/workflows/snapshots-4h.yml'

permissions:
  contents: write

concurrency:
  group: wm-snapshots-4h
  cancel-in-progress: false

jobs:
  snapshots:
    runs-on: ubuntu-latest
    # The fetchers resolve their output paths from WM_REPO_DIR; here that is the
    # Actions checkout, so the same scripts run unmodified in the cloud.
    env:
      WM_REPO_DIR: ${{ github.workspace }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate snapshots
        id: fetch
        run: |
          set +e
          fail=0
          python3 fetch_amber.py     || fail=$((fail+1))
          python3 fetch_outbreaks.py || fail=$((fail+1))
          python3 fetch_iss.py       || fail=$((fail+1))
          python3 fetch_worldpop.py  || fail=$((fail+1))
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
          echo "--- produced ---"
          grep -o '"_updated": "[^"]*"' amber.js outbreaks.js 2>/dev/null | head
          grep -o '"epoch": "[^"]*"' iss.js 2>/dev/null | head
          python3 -c "import json;d=json.loads(open('worldpop.js').read().split('=',1)[1].rsplit(';',1)[0]);print('FIGU scans:',len(d['series']),'last:',d['series'][-1][1])" 2>/dev/null | head -1
          if [ "$fail" -ge 4 ]; then
            echo "::error::every fetcher failed — the runner could not reach any source"
            exit 1
          fi
          if [ "$fail" -gt 0 ]; then
            echo "::warning::$fail fetcher(s) hit an unreachable/empty source this cycle"
          fi
          exit 0

      - name: Commit and push when changed
        run: |
          set -e
          git config user.name  "world-monitor-bot"
          git config user.email "world-monitor-bot@users.noreply.github.com"
          git add amber.js outbreaks.js iss.js worldpop.js
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "snapshot: NCMEC alerts + WHO outbreaks + ISS TLE + world population (automated, $(date -u '+%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "push failed after 4 attempts"; exit 1
