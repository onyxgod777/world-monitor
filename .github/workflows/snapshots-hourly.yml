# NOTE (2026-10-20): scheduled runs are OFF — the laptop Hermes cron is the single
# writer for these snapshots. Kept as a manual cloud fallback (workflow_dispatch).
# World Monitor — hourly snapshots (Intel news feed, FiatLeak movers, social signals).
#
# Runs on GitHub's runners so the dashboard keeps refreshing with the maintainer's
# laptop off. Commits only when the data actually changed.
name: WM snapshots — hourly

on:
  # Scheduled runs are DISABLED: the laptop cron (Hermes job 'wm-snapshot-sweep',
  # hourly at :05, plus the 15/30/60-minute quake, flood and flight fetchers) is the
  # single writer for these snapshots. Two pipelines committing the same files was
  # costing ~300 commits/day and constant push races, so this workflow now runs only
  # on demand (workflow_dispatch) as a cloud fallback if the laptop is offline.
  workflow_dispatch:
  push:
    paths:
      - 'fetch_news.py'
      - 'fetch_fiatleak.py'
      - 'fetch_social.py'

permissions:
  contents: write

concurrency:
  group: wm-snapshots-hourly
  cancel-in-progress: false

jobs:
  snapshots:
    runs-on: ubuntu-latest
    # The fetchers resolve their output paths from WM_REPO_DIR; here that is the
    # Actions checkout, so the same scripts run unmodified in the cloud.
    env:
      WM_REPO_DIR: ${{ github.workspace }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # A source that yields nothing must not stop the other fetchers; each one
      # refuses to overwrite its snapshot with empty data on its own. Record how
      # many failed so an all-sources outage shows up as a red run.
      - name: Generate snapshots
        id: fetch
        run: |
          set +e
          fail=0
          python3 fetch_news.py     || fail=$((fail+1))
          python3 fetch_fiatleak.py || fail=$((fail+1))
          python3 fetch_social.py   || fail=$((fail+1))
          python3 fetch_edgar.py    || fail=$((fail+1))
          python3 fetch_cams.py     || fail=$((fail+1))
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
          echo "--- produced ---"
          grep -o '"_updated": "[^"]*"' news.js fiatleak.js social.js edgar.js cams.js 2>/dev/null | head
          if [ "$fail" -ge 5 ]; then
            echo "::error::every fetcher failed — the runner could not reach any source"
            exit 1
          fi
          if [ "$fail" -gt 0 ]; then
            echo "::warning::$fail fetcher(s) hit an unreachable/empty source this cycle"
          fi
          exit 0

      - name: Commit and push when changed
        run: |
          set -e
          git config user.name  "world-monitor-bot"
          git config user.email "world-monitor-bot@users.noreply.github.com"
          git add news.js fiatleak.js social.js edgar.js cams.js
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "snapshot: intel + fiatleak + social (automated, $(date -u '+%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "push failed after 4 attempts"; exit 1
